[project]
name = "pulse"
version = "0.1.0"
description = "Turn-by-turn conversion-probability estimation for two-person sales conversations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[project.scripts]
pulse-acquire = "pulse.data.acquire:main"
pulse-parse = "pulse.data.parse:main"
pulse-eda = "pulse.eda.phase0:main"
pulse-split = "pulse.data.split:main"
pulse-encode = "pulse.features.encoder:main"
pulse-features = "pulse.features.build:main"
pulse-train = "pulse.train.train:main"
pulse-evaluate = "pulse.eval.evaluate:main"
pulse-fetch-models = "pulse.serve.models:main"
pulse-serve = "pulse.serve.app:main"
pulse-benchmark = "pulse.serve.benchmark:main"
pulse-import-session = "pulse.serve.import_session:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
